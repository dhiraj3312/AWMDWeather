name: Global Build Android APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Auto Detect framework and Build
        run: |
          if [ -f pubspec.yaml ]; then
            echo "Detected Flutter Project"
            flutter pub get
            flutter build apk --release
            mkdir -p output-apk && cp build/app/outputs/flutter-apk/app-release.apk output-apk/
          elif [ -f package.json ] && [ -d android ]; then
            echo "Detected React Native Project"
            npm install
            cd android && ./gradlew assembleRelease && cd ..
            mkdir -p output-apk && cp android/app/build/outputs/apk/release/app-release.apk output-apk/
          elif [ -d android ]; then
            echo "Detected Native Android Project"
            cd android && ./gradlew assembleRelease && cd ..
            mkdir -p output-apk && cp android/app/build/outputs/apk/release/app-release.apk output-apk/
          elif [ -f build.gradle ]; then
            echo "Detected Root Android Project"
            ./gradlew assembleRelease
            mkdir -p output-apk && cp app/build/outputs/apk/release/app-release.apk output-apk/
          else
            echo "Error: No suitable project file found! Creating a placeholder file for check."
            exit 1
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OneSpace-App-APK
          path: output-apk/*.apk
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mobile-App-APK
          path: android/app/build/outputs/apk/release/app-release.apk
          
